---
name: 'CD'
on:
  push:
    tags:
      - '**'
jobs:
  changelog:
    if: >-
      !contains(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-24.04
    name: Generate and commit changelog
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set git user info
        run: |
          git config user.name 'Temeraire'
          git config user.email 'actions@chaotic.cx'

      - name: Determine source branch
        id: determine_branch
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref_name }})
          echo "Tag commit: $TAG_COMMIT"

          # Release exactly the tagged commit: it must be the tip of a pushed branch, so the
          # version bump lands on top of it and nothing else gets released. Never guess.
          BRANCHES=$(git branch -r --points-at "$TAG_COMMIT" | grep -v '/HEAD' | sed 's/^ *origin\///')
          if [ -z "$BRANCHES" ]; then
            echo "::error::Tag ${{ github.ref_name }} ($TAG_COMMIT) is not the tip of any pushed branch. Push the branch first, then tag its latest commit."
            exit 1
          fi
          if echo "$BRANCHES" | grep -qx main; then
            BRANCH=main
          elif [ "$(echo "$BRANCHES" | wc -l)" -eq 1 ]; then
            BRANCH=$BRANCHES
          else
            echo "::error::Tag ${{ github.ref_name }} is the tip of several branches:"
            echo "$BRANCHES"
            exit 1
          fi
          echo "Releasing from branch: $BRANCH"
          echo "target_branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Checkout target branch
        run: |
          git checkout ${{ steps.determine_branch.outputs.target_branch }}

      - name: Generate a changelog for the latest release
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -v --no-exec --github-repo ${{ github.repository }} --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: /tmp/CHANGES.md

      - name: Generate a complete changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -v --no-exec --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Add changelog to commit
        run: git add CHANGELOG.md

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get -y install jq

      - name: Update package.json's
        run: |
          JQ_VERSION=${{ github.ref_name }} jq '.version=env.JQ_VERSION' ./core/package.json > /tmp/package-core.json
          JQ_VERSION=${{ github.ref_name }} jq '.version=env.JQ_VERSION' ./themes/package.json > /tmp/package-themes.json
          mv /tmp/package-core.json ./core/package.json
          mv /tmp/package-themes.json ./themes/package.json
          git add ./core/package.json ./themes/package.json

      - name: Commit changes
        run: |
          git commit -m "chore(core): bump version to ${{ github.ref_name }}"
          git tag release/${{ github.ref_name }}

      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          branch: ${{ steps.determine_branch.outputs.target_branch }}
          ssh: true
          tags: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/CHANGES.md
          fail_on_unmatched_files: true
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: contains(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-24.04
    name: Publish to NPM
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: Publish to NPM
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          NPM_ARGS=()
          echo "${{ github.ref_name }}" | grep -q 'rc' && NPM_ARGS+=(--tag rc)

          # pnpm/setup's node doesn't ship npm; the runner's system npm (10.x)
          # has no OIDC auto-auth, so run publish via the latest npm directly.
          # Publish from inside each package: npm rejects the root package.json's
          # devEngines.packageManager (pnpm) with EBADDEVENGINES.
          pnpx nx run core:build
          (cd dist/core && pnpx --yes npm@latest publish "${NPM_ARGS[@]}" --loglevel verbose)

          pnpx nx run themes:build
          (cd dist/themes && pnpx --yes npm@latest publish "${NPM_ARGS[@]}" --loglevel verbose)

      - name: Upload npm debug log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: ~/.npm/_logs/*.log
