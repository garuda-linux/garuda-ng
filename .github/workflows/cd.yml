---
name: 'CD'
# Release by pushing a version tag (e.g. `2.1.0` or `2.1.0-rc.5`) on the commit to release.
# The tagged commit is verified and published as-is: the version comes from the tag and is
# only written into the package manifests inside CI, so nothing is committed back.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    name: Verify release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Validate tag
        id: version
        run: |
          VERSION='${{ github.ref_name }}'
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'; then
            echo "::error::Tag '$VERSION' is not a release version (X.Y.Z or X.Y.Z-rc|beta|alpha.N)."
            exit 1
          fi
          # Prereleases go to their own dist-tag so `latest` only ever points at stable versions.
          PRE=$(echo "$VERSION" | sed -nE 's/^[^-]+-([a-z]+)\..*$/\1/p')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=${PRE:-latest}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
          diagnostic-endpoint: ''

      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Run linters via pre-commit
        run: nix develop -c pre-commit run --all-files

      - name: Lint, test and build
        run: pnpm exec nx run-many --targets=lint,test,build --all

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    name: Publish to NPM
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: Set version from tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for pkg in core themes; do
            jq '.version = env.VERSION' "$pkg/package.json" > "$RUNNER_TEMP/package.json"
            mv "$RUNNER_TEMP/package.json" "$pkg/package.json"
          done

      - name: Build
        run: pnpm exec nx run-many --target=build --projects=core,themes

      - name: Publish to NPM
        env:
          NPM_CONFIG_PROVENANCE: true
          NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
        run: |
          # pnpm/setup's node doesn't ship npm and the runner's npm has no OIDC auto-auth, so use
          # the latest npm. Publish from inside each package: npm rejects the root package.json's
          # devEngines.packageManager (pnpm) with EBADDEVENGINES.
          for pkg in core themes; do
            (cd "dist/$pkg" && pnpx --yes npm@latest publish --tag "$NPM_TAG" --loglevel verbose)
          done

      - name: Upload npm debug log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-log
          path: ~/.npm/_logs/*.log

  release:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    name: Create GitHub release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -v --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: ${{ runner.temp }}/CHANGES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/CHANGES.md
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.verify.outputs.npm_tag != 'latest' }}
