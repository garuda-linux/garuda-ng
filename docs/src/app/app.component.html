<garuda-shell [menuItems]="menuItems">
  <p-button
    garudaShellBarStart
    icon="pi {{ sidebarToggleService.icon() }}"
    [text]="true"
    (onClick)="sidebarToggleService.toggle()"
    [style.display]="sidebarToggleService.arrowDisplayStyle()"
    class="sidebar-toggle"
  ></p-button>
  <img garudaShellBarStart ngSrc="/garuda-purple.svg" width="28" height="28" alt="logo" routerLink="/" style="cursor: pointer" />
  <div class="header-title" garudaShellBarStart>
    Welcome Friend!
  </div>
  <a garudaShellBarEnd garudaShellBarLink href="https://github.com/garuda-linux/garuda-ng">
    <i class="pi pi-github"></i>
  </a>
  <div [@routerTransition]="prepareRoute(routerOutlet)" class="app-container">
    <router-outlet #routerOutlet="outlet"></router-outlet>
  </div>
</garuda-shell>
<garuda-footer [footerItems]="footerItems" [relativePosition]="true"></garuda-footer>
