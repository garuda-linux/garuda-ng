<footer [ngClass]="relativePosition ? 'footer-relative' : 'footer-relative'">
    <div class="footer-content">
        <div class="footer-links" *ngFor="let footerItem of footerItems; index as i; trackBy: trackByFn" >
            <a [href]="footerItem?.routerLink" *ngIf="!footerItem?.popupConfig?.popupEnabled; else clickable">{{ footerItem?.itemName }}</a>
            <ng-template #clickable>
                <a (click)="openPopup(footerItem?.itemId)" (keyup.enter)="openPopup(footerItem?.itemId)" (keyup.space)="openPopup(footerItem?.itemId)" role="button" tabindex="footerItem?.itemId">{{ footerItem?.itemName }}</a>
            </ng-template>
            <span *ngIf="ismobile(); else desktop"><span></span></span>
            <ng-template #desktop>
                <span *ngIf="i!==totalItems()-1">&nbsp;|&nbsp;</span>
            </ng-template>
        </div>
    </div>
</footer>
